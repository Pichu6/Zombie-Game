<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Real time needed for one game day, by game and by our speed ladder</title>
<desc id="d">Horizontal bars on a log scale. Real time 24 hours; Haven and Hearth about 7.3 hours; our usual speed 1 hour; 3 times 20 minutes; 10 times 6 minutes; 60 times 1 minute; 360 times 10 seconds.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2dd;--ours:#2a78d6;--hh:#eb6834}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#34332f;--ours:#3987e5;--hh:#d95926}}
text{fill:var(--ink)} .s{fill:var(--ink2)} .g{stroke:var(--grid);stroke-width:1}
</style>
<rect width="760" height="372" fill="var(--surface)"/>
<text x="24" y="32" font-size="17" font-weight="600">How long one game day takes in real time</text>
<text class="s" x="24" y="52" font-size="12">Log scale: a shorter bar is a faster game. Haven and Hearth derived from its reported 180-day year = 54 d 17 h 4 min.</text>
<rect x="24" y="66" width="12" height="12" rx="2" fill="var(--ours)"/><text x="42" y="77" font-size="12">Our speed ladder (proposal)</text>
<rect x="230" y="66" width="12" height="12" rx="2" fill="var(--hh)"/><text x="248" y="77" font-size="12">Haven and Hearth (reported)</text>
<line class="g" x1="280.8" y1="90" x2="280.8" y2="320"/>
<text class="s" x="280.8" y="338" font-size="11" text-anchor="middle">10 s</text>
<line class="g" x1="360.4" y1="90" x2="360.4" y2="320"/>
<text class="s" x="360.4" y="338" font-size="11" text-anchor="middle">1 min</text>
<line class="g" x1="462.7" y1="90" x2="462.7" y2="320"/>
<text class="s" x="462.7" y="338" font-size="11" text-anchor="middle">10 min</text>
<line class="g" x1="542.3" y1="90" x2="542.3" y2="320"/>
<text class="s" x="542.3" y="338" font-size="11" text-anchor="middle">1 h</text>
<line class="g" x1="644.6" y1="90" x2="644.6" y2="320"/>
<text class="s" x="644.6" y="338" font-size="11" text-anchor="middle">10 h</text>
<line class="g" x1="683.5" y1="90" x2="683.5" y2="320"/>
<text class="s" x="683.5" y="338" font-size="11" text-anchor="middle">1 day</text>
<path d="M250,104.0 H679.5 a4,4 0 0 1 4,4 V116.0 a4,4 0 0 1 -4,4 H250 Z" fill="var(--ours)"/>
<text x="240" y="117.0" font-size="12.5" text-anchor="end">Real time (1:1)</text>
<text x="691.5" y="117.0" font-size="12.5" font-weight="600">24 h</text>
<path d="M250,136.0 H626.6 a4,4 0 0 1 4,4 V148.0 a4,4 0 0 1 -4,4 H250 Z" fill="var(--hh)"/>
<text x="240" y="149.0" font-size="12.5" text-anchor="end">Haven and Hearth</text>
<text x="638.6" y="149.0" font-size="12.5" font-weight="600">7.3 h</text>
<path d="M250,168.0 H538.3 a4,4 0 0 1 4,4 V180.0 a4,4 0 0 1 -4,4 H250 Z" fill="var(--ours)"/>
<text x="240" y="181.0" font-size="12.5" text-anchor="end">Usual speed (1 h = 1 day)</text>
<text x="550.3" y="181.0" font-size="12.5" font-weight="600">1 h</text>
<path d="M250,200.0 H489.5 a4,4 0 0 1 4,4 V212.0 a4,4 0 0 1 -4,4 H250 Z" fill="var(--ours)"/>
<text x="240" y="213.0" font-size="12.5" text-anchor="end">3×</text>
<text x="501.5" y="213.0" font-size="12.5" font-weight="600">20 min</text>
<path d="M250,232.0 H436.0 a4,4 0 0 1 4,4 V244.0 a4,4 0 0 1 -4,4 H250 Z" fill="var(--ours)"/>
<text x="240" y="245.0" font-size="12.5" text-anchor="end">10×</text>
<text x="448.0" y="245.0" font-size="12.5" font-weight="600">6 min</text>
<path d="M250,264.0 H356.4 a4,4 0 0 1 4,4 V276.0 a4,4 0 0 1 -4,4 H250 Z" fill="var(--ours)"/>
<text x="240" y="277.0" font-size="12.5" text-anchor="end">60×</text>
<text x="368.4" y="277.0" font-size="12.5" font-weight="600">1 min</text>
<path d="M250,296.0 H276.8 a4,4 0 0 1 4,4 V308.0 a4,4 0 0 1 -4,4 H250 Z" fill="var(--ours)"/>
<text x="240" y="309.0" font-size="12.5" text-anchor="end">360×</text>
<text x="288.8" y="309.0" font-size="12.5" font-weight="600">10 s</text>
<line x1="250" y1="90" x2="250" y2="320" stroke="var(--ink2)" stroke-width="1"/>
<text class="s" x="24" y="360" font-size="11">Speeds 3× to 360× are the Tier 0 time bar (spec 16). Source for Haven and Hearth: Ring of Brodgar wiki figures via search summary.</text>
</svg>