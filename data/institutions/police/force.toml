# The police force that serves a town (spec 65): how many officers it takes to run one search, and the smallest force. Its
# officers are pops with shifts (day, evening and night in turn), and a search can run only while enough of them are on duty
# and present. The force's size comes from the town's people by the BJS size curve (spec 69, data/services/police.toml).
# Both numbers here are DEFAULTS taken by Claude, not sourced.

[default]
officers_per_search = 2     # officers it takes to run one search
min_officers = 6            # a small town's force is never smaller than this (a station keeps three shifts)

[index]
high = "default"
upper_middle = "default"
lower_middle = "default"
low = "default"
