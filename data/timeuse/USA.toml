# Leisure takes what the day leaves (TU-9: 95 % participate, 4.60 h weekdays, 6.48 h weekends over everyone); it is
# the filler of the template chain, so it has no row.

[sleep]
weekday_hours = 8.76          # TU-1
weekend_hours = 9.68          # TU-1
night_sd_minutes = 70         # TU-45, TU-46: within-person night-to-night SD
bedtime_mean = "23:00"        # estimate: TU-44 says society governs bedtime; the wake time follows from the hours
bedtime_sd_minutes = 45       # estimate (drawn once per pop)

[work_pattern]                # TU-15: the main job's pattern, drawn once at hire
day = 0.85
evening = 0.05
night = 0.03
rotating = 0.07
weekend_workers = 0.08        # TU-16: usually work Saturday and Sunday

[departure]                   # TU-41, TU-42: when workers leave home, drawn once per pop
# bins of half an hour from 05:00; the share leaving in each (sums to 1; 57 % between 06:00 and 08:29, peak 07:00-07:29)
bins_from = "05:00"
shares = [0.06, 0.08, 0.10, 0.13, 0.141, 0.11, 0.09, 0.07, 0.05, 0.04, 0.03, 0.03, 0.03, 0.03, 0.03]
finding = "TU-41, TU-42 (the exact B08302 values are not fetched, TU-43: the shape is an estimate around the two sourced points)"

[commute]                     # TU-40: one way, drawn once per pop (home and workplace fixed)
mean_minutes = 27.6
sigma = 0.70                  # lognormal spread chosen so that about 10 % are over 60 min and 12 % under 10 min
