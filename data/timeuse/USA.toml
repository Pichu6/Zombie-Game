# Time use, United States: BLS American Time Use Survey 2025 (civilian population aged 15+, annual averages).
# Spec 54 slice 1 (decision 0071): a day is a participation draw, then a duration draw; never population means.
# Findings: TU-1 to TU-16, TU-40 to TU-42, TU-45 (docs/research/daily-lives-and-time-use.md).
id = "USA"
source = "BLS ATUS 2025, Tables 1-4 and news release; ACS 2019 commuting"
method = "diary"
population = "civilian 15+"
weekly_hours_target = 37.80   # ILOSTAT 2023 mean actual weekly hours per employed person, main job (TU-37)
women_share_of_employed = 0.47  # BLS: women are about 47 % of the employed (estimate from memory, not fetched)

# Activity rows: who = { employment = ... } narrows the row; a row without `who` is for everyone.
# day: weekday | saturday | sunday_holiday | any. participation in [0, 1]; hours_if_done in hours.
# employment: full_time | part_time | not_employed | student | retired | child

[[row]]
activity = "work"
who = { employment = "full_time" }
day = "weekday"
participation = 0.873
hours_if_done = 8.45
finding = "TU-4"

[[row]]
activity = "work"
who = { employment = "full_time" }
day = "saturday"
participation = 0.296
hours_if_done = 5.49
finding = "TU-4"

