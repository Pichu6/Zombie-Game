# Time use, India: MoSPI Time Use Survey 2024 (ages 15-59 unless said), a diary of half-hour slots.
# Findings: TU-24 to TU-29. Rows not covered by the survey's press note borrow the US shape (USA.toml), marked.
id = "IND"
source = "MoSPI TUS 2024 press note (28 Mar 2025); ILOSTAT 2023"
method = "diary"
population = "ages 15-59 (employment, domestic); 6+ (self-care)"
weekly_hours_target = 45.82   # ILOSTAT 2023 (TU-37): men 50.22, women 36.24
women_share_of_employed = 0.25  # TU-25: 25 % of women and 75 % of men work on a day, so about a quarter of the employed are women

# Employment and related activities (TU-25): participation men 75.0 %, women 25.0 % on a day among everyone aged
# 15-59; 480 / 344 min per participant. The rows below are for the employed: a six-day week (CK rule 3) with the
# participation of the US employed on weekdays (TU-3) and a Saturday most work; they land on ILOSTAT's 50.2 / 36.2 h.
[[row]]
activity = "work"
who = { employment = "full_time", sex = "m" }
day = "weekday"
participation = 0.92
hours_if_done = 8.5
finding = "TU-25 (75.0 % all days; 480 min), day split borrowed from TU-3"

[[row]]
activity = "work"
who = { employment = "full_time", sex = "m" }
day = "saturday"
participation = 0.80
hours_if_done = 8.0
finding = "TU-25; India works six days in most sectors (CK rule 3: six-day private week), estimate"

