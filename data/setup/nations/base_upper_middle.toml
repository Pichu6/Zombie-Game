# Base country, upper-middle income: a fictional country built from the Upper-middle-income countries aggregate of UN DESA Population Division, World Population Prospects 2024 (CC BY 3.0 IGO).
# Written by tools/data/global_tables.py. Sourced: the age pyramid, the pop parameters (mortality, fertility, sex
# ratio at birth), sectors and households. Still placeholder shapes: education, labour, occupations and
# settlement, so the profile's status stays "placeholder" until those tables are sourced too.

id = "base_upper_middle"
name = "Base country, upper-middle income"
status = "placeholder"
pop_params = "demography/wpp2024_upper_middle.toml"

