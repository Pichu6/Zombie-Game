# Jobs the pop generator draws for working-age adults (docs/design/content-tools.md section 4).
# share: rough share of US employment, an estimate from BLS Occupational Employment and Wage Statistics
#   (May 2023) major groups, split by hand; only the ratios matter.
# workplace: a business type in businesses.toml ("" = no fixed workplace, works around town).
# education: lowest level the job needs (none, high_school, trade, bachelor, master, doctorate).
# skills: tags the AI and the body/know-how model can read later; not numbers yet.
# group: the ILO modelled occupation group (spec 47): 0 managers, 1 professionals, 2 technicians and associate
#   professionals, 3 clerical support, 4 services and sales, 5 craft and trades, 6 plant and machine operators,
#   7 skilled agriculture and elementary occupations. Soldiers have no group of their own there; counted as 4.

