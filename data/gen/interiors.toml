# Spec 51: furniture per room type, placed in this order along the walls; a piece that would cut a free cell of
# the room off from its door is skipped. Beds (one per occupant) are added to bedrooms first and do not block.

blocking = ["fridge", "stove", "sink", "pantry", "table", "sofa", "wardrobe", "toilet", "bathtub", "hot_plate", "stockpile", "generator"]

[room.main]
kit = ["pantry", "fridge", "stove", "sink", "table", "sofa", "lamp"]

[room.kitchen]
kit = ["pantry", "fridge", "stove", "sink", "table", "lamp"]

[room.living]
kit = ["sofa", "table", "lamp"]

[room.bedroom]
kit = ["wardrobe", "lamp"]

[room.bath]
kit = ["toilet", "sink", "bathtub"]

# Spec 69: a police station's rooms (estimates). Desks and lockers come one per occupant (room.seat) and do not block;
# shelves, safes and benches do not block either (they are not in the list above).
[room.lobby]
kit = ["desk", "bench", "lamp"]

[room.squad]
kit = ["lamp"]

[room.office]
kit = ["shelf", "lamp"]

[room.investigators]
kit = ["shelf", "lamp"]

[room.records]
kit = ["shelf", "lamp"]

[room.locker]
kit = ["bench"]

[room.evidence]
kit = ["shelf", "safe"]

[room.washroom]
kit = ["toilet", "sink"]

[room.cell]
kit = ["toilet"]

# Spec 72: what stands on a town's plots (estimates). A flat is one room with its kitchen, bathroom fixtures and beds; a
# stair hall leads to the stairs at the back of the corridor.
[room.flat]
kit = ["pantry", "fridge", "stove", "sink", "table", "toilet", "wardrobe", "lamp"]

[room.hall]
kit = ["lamp"]

[room.shop]
kit = ["desk", "shelf", "shelf", "shelf", "lamp"]

[room.storeroom]
kit = ["shelf", "shelf", "stockpile"]

[room.workshop]
kit = ["workbench", "shelf", "stockpile", "lamp"]
