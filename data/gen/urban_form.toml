# A town's streets, blocks and plots (spec 71, decision 0077 item 3.2), from research city-layout-generation (CL).
# Per income group: built-up density, intersection density (which sets the street spacing, CL-51), and the frontage of a
# house plot. Lines marked ESTIMATE are defaults taken by Claude where the note found no source.

street_share = 0.30        # share of built-up land in streets: about 30 % in classic grids (CL-23, CL-24), 20-30 % typical (CL-26)
open_share = 0.15          # open public space: UN-Habitat recommends 15-20 % (CL-26)
commercial_share = 0.10    # ESTIMATE: blocks of shops, offices and services around the centre (no whole-city land-use source, CL open 2)
industrial_share = 0.06    # ESTIMATE: blocks of workshops and industry at the town's edge
vacancy = 0.05             # ESTIMATE: dwelling units left empty
arterial_every = 3         # every third street is an arterial: 200-400 m apart at these spacings (CL-41)
arterial_width_factor = 1.5  # ESTIMATE: an arterial's reserve against a local street's
max_units_per_plot = 12    # ESTIMATE: a walk-up apartment house, where houses alone cannot hold the households
commercial_frontage_m = 15 # ESTIMATE
industrial_frontage_m = 40 # ESTIMATE

[group.high]
density_per_ha = 49        # ESTIMATE between CL-30's 28 (land-rich developed) and 70 (other developed)
intersections_per_km2 = 60 # CL-35: Northern America 53, Western Europe 73
frontage_m = 20            # a US lot of 650 m2 (CL-46, CL-47) at about 32 m deep

[group.upper_middle]
density_per_ha = 100       # ESTIMATE between CL-30's 70 and 135 (developing)
intersections_per_km2 = 120 # CL-35: Southern Europe 116, South-Central Asia 134
frontage_m = 12            # ESTIMATE between a Manhattan lot (7.6 m, CL-21) and a US lot

[group.lower_middle]
density_per_ha = 135       # CL-30: developing countries
intersections_per_km2 = 160 # CL-35: South America 198 and South-Central Asia 134
frontage_m = 8             # ESTIMATE

[group.low]
density_per_ha = 135       # CL-30: developing countries
intersections_per_km2 = 260 # CL-35: Eastern Africa 267, Northern Africa 284
frontage_m = 6             # a machiya's 5.4-6 m (CL-45)
