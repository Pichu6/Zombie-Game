# Stage 4: stores (stocks without identity) and loose items. `kind = "item"` places one instance of
# the item definition `id`; `contents` fills a container with a stock.

[[object]]
kind = "pantry"
at = [0, 3, 10]
food_kj = 120000

# Spec 80: each house on the block has its own pantry and fridge for its 2 residents (FR-9: 3 days and 2), listed after
# the main building's so the run's group still eats from its own kitchen (the pop AI takes the first of each kind).
# `id` names the house: spec 17's power system leaves a house's appliances out (the houses run off the town's mains, not
# the main building's generator; not modelled yet), and spec 81 gives each house's household its own stores.
