[[process]]
id = "salvage_furniture"
name = "Break apart"
primitive = "pry"
target = "item:chair"
trade = "carpentry"
time_s = 240
tools = [{ prop = "lever", min = 0.25, ref = 1.0 }, { prop = "blunt", min = 0.5, ref = 1.0 }]
effects = [{ op = "salvage" }]
source = "estimate: a few minutes to knock apart a nailed chair"

[[process]]
id = "barricade"
name = "Nail a board across"
primitive = "strike"
target = "edge:window"
trade = "carpentry"
