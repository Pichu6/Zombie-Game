  { name = "strike_plate", accepts = "strike_plate", joint = "screwed", default = "strike_plate" },
  { name = "hinges", accepts = "hinge_set", joint = "screwed", default = "hinge_set" },
  { name = "panel", accepts = "door_panel", joint = "screwed", default = "door_panel_hollow" },
  { name = "frame", accepts = "door_frame", joint = "nailed", default = "door_frame" },
]

[[item]]
id = "door_exterior"
family = "door"
mass_g = 0
sound_loss_db = 30
failure_chain = ["strike_plate", "hinges", "panel", "frame"]
source = "solid-core door, STC ~30 (typical ratings)"
slot = [
  { name = "strike_plate", accepts = "strike_plate", joint = "screwed", default = "strike_plate" },
  { name = "hinges", accepts = "hinge_set", joint = "screwed", default = "hinge_set" },
  { name = "panel", accepts = "door_panel", joint = "screwed", default = "door_panel_solid" },
  { name = "frame", accepts = "door_frame", joint = "nailed", default = "door_frame" },
]

[[item]]
id = "window"
family = "window"
mass_g = 0
sound_loss_db = 25
failure_chain = ["glass", "frame"]
source = "single glazing, STC ~25 (typical ratings)"
slot = [
  { name = "glass", accepts = "glass_pane", joint = "glued", default = "glass_pane" },
  { name = "frame", accepts = "window_frame", joint = "screwed", default = "window_frame" },
]

[[item]]
id = "fence"
family = "fence"
mass_g = 0
sound_loss_db = 3
failure_chain = ["boards", "post"]
source = "estimate: a wooden fence barely blocks sound"
slot = [
  { name = "boards", accepts = "fence_boards", joint = "nailed", default = "fence_boards" },
  { name = "post", accepts = "fence_post", joint = "loose", default = "fence_post" },
]

[[item]]
id = "gate"
family = "gate"
mass_g = 0
sound_loss_db = 3
failure_chain = ["latch", "hinges", "boards"]
source = "estimate"
slot = [
  { name = "latch", accepts = "gate_latch", joint = "screwed", default = "gate_latch" },
  { name = "hinges", accepts = "hinge_set", joint = "screwed", default = "hinge_set" },
  { name = "boards", accepts = "fence_boards", joint = "nailed", default = "fence_boards" },
]

[[item]]
id = "barricade"
family = "barricade"
mass_g = 0
failure_chain = ["fasteners", "board_1", "board_2", "board_3"]
source = "three planks nailed across an opening (spec 10 rule 5)"
slot = [
  { name = "fasteners", accepts = "fasteners", joint = "loose" },
  { name = "board_1", accepts = "plank", joint = "nailed" },
  { name = "board_2", accepts = "plank", joint = "nailed", required = false },
  { name = "board_3", accepts = "plank", joint = "nailed", required = false },
]

