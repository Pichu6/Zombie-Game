# ---------- Map edges (one per 1 m segment) ----------

[[item]]
id = "wall_interior"
family = "wall"
mass_g = 0
sound_loss_db = 35
failure_chain = ["panel_a", "frame", "panel_b"]
source = "stud wall with gypsum both sides, STC ~33-38 (ASTM E413 typical ratings)"
slot = [
  { name = "panel_a", accepts = "drywall_panel", joint = "screwed", default = "drywall_panel" },
  { name = "frame", accepts = "stud_frame", joint = "nailed", default = "stud_frame" },
  { name = "panel_b", accepts = "drywall_panel", joint = "screwed", default = "drywall_panel" },
]

[[item]]
id = "wall_exterior"
family = "wall"
mass_g = 1180000
sound_loss_db = 47
hold_force_n = 50000
source = "230 mm brick, 1 m x 2.7 m at ~1900 kg/m3; STC ~45-50 (ASTM E413 typical ratings); not breachable by hand in Tier 0"

[[item]]
id = "door_interior"
family = "door"
mass_g = 0
sound_loss_db = 20
failure_chain = ["strike_plate", "hinges", "panel", "frame"]
