# Tier 0 item definitions. Spec: docs/tier0/specs/08-assembly.md, 10-fortification.md, 15-items-recipes.md
# Masses in grams, forces in newtons, sound losses in dB. Every number names its source or says "estimate".
# Stage 2 holds the structural items (walls, doors, windows, fences, barricades); stage 4 adds the rest.

# ---------- Materials (spec 15 model: physical numbers live here) ----------

[[material]]
id = "pine"
density_kg_m3 = 500
hardness = 0.3
source = "softwood ~450-550 kg/m3 (Wood Handbook, USDA FPL 2010); hardness relative, estimate"

[[material]]
id = "steel"
density_kg_m3 = 7850
hardness = 1.0
source = "carbon steel (engineering tables)"

[[material]]
id = "cotton"
density_kg_m3 = 1540
hardness = 0.0
source = "cellulose fibre density (engineering tables)"

[[material]]
id = "glass"
density_kg_m3 = 2500
hardness = 0.8
source = "soda-lime float glass (engineering tables)"

[[material]]
id = "gypsum"
density_kg_m3 = 700
hardness = 0.2
source = "gypsum board ~700 kg/m3 (manufacturer data)"

[[material]]
id = "plastic"
density_kg_m3 = 950
hardness = 0.2
source = "polyethylene ~950 kg/m3 (engineering tables)"

