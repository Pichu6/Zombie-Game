# The Try panel (spec 55 rule 4, atlas design §3): everything runnable, newest first in the panel.
# run: the arguments after zs.exe. {seed} is the panel's seed, {world} the open world's name, {out} a folder for files.
# kind: window (opens the game window) | text (shows the output) | image (shows the file it wrote) | test (ctest, workshop only).
# workshop = true: only shown when a repo sits next to the executable (decision 0073).

[[try]]
id = "play"
part = "individual"
spec = "16"
title = "Play the open world"
what = "The 14-day run seen from above: walk, act, save with F5. Opens the world selected on the Worlds page."
run = ["--play", "--world", "{world}"]
kind = "window"
added = 2026-10-11

[[try]]
id = "possess-officer"
part = "individual"
spec = "68"
title = "Possess a police officer"
what = "A free-camera player takes an officer from his shift for 4 hours: he gets a body and comes onto the block (spec 68), misses a shift unpaid, leaves the block, and meets a conduct case on his return (decisions 0068, 0070). With --hours 30 he is left standing on the block during the outbreak and does not survive."
run = ["--absence", "--possess", "--officer", "--hours", "4", "--seed", "{seed}"]
kind = "text"
added = 2026-10-12

[[try]]
id = "possess-call-in"
part = "individual"
spec = "66"
title = "Possess someone and call in"
what = "The player takes Oscar Ortega for 30 hours and calls in at once as him: the household's ladder and the employer's count never start (decision 0070 rule 2). Without --call-in his partner phones, asks around and reports him."
run = ["--absence", "--possess", "--pop", "1", "--hours", "30", "--call-in", "--seed", "{seed}"]
kind = "text"
added = 2026-10-12

[[try]]
id = "calendar-window"
part = "individual"
spec = "53"
title = "The calendar in the window"
what = "The date, the holidays and whether schools are open, in the time line (spec 53, decision 0072)."
run = ["--play", "--seed", "{seed}"]
kind = "window"
added = 2026-10-11

[[try]]
id = "run-chronicle"
part = "individual"
spec = "26"
title = "The 14-day run, as text"
what = "The run without a window: the AI drives everyone; the chronicle says who died, when and why."
run = ["--run", "--seed", "{seed}"]
kind = "text"
added = 2026-10-08

[[try]]
id = "world-map"
