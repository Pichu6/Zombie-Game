# The cards (atlas design §5, spec 55 slice 3): for each kind of entity, what the design says it needs, row by row,
# and the spec that produces the row today. A row with no `spec` is lacking: designed, not produced. A row whose
# producer exists but whose value the Atlas does not read yet shows "not read yet". The card draws the value from the
# generator's record by `field`; the design doc is where the row is argued.

[[card]]
id = "world"
title = "The world"
design = "design/world-numbers.md"
rows = [
  { field = "seed", need = "The seed", spec = "02" },
  { field = "cells", need = "Grid cells at Earth size", spec = "30" },
  { field = "land", need = "Land area", spec = "31" },
  { field = "people", need = "People today", spec = "48" },
  { field = "countries", need = "Countries formed on the land", spec = "52" },
  { field = "towns", need = "Towns by rank-size", spec = "48" },
  { field = "history", need = "The contest history: start polities, periods, events", spec = "52" },
  { field = "start_date", need = "The start date (default Monday 11 January 2027)", spec = "53" },
  { field = "sliders", need = "Land share, temperature, relief, moisture, fragmentation", spec = "31" },
  { field = "fed", need = "People each cell can feed and water", spec = "52" },
  { field = "", need = "Fields evaluable below a cell (the zoom continuum section 4)" },
  { field = "", need = "Crust apart from plates, broken island arcs, deeper ocean floor (spec 31 Open)" },
]

[[setting]]
field = "continents"
label = "Continents"
what = "How many cores the continents grow from. 1 makes one supercontinent (a Pangaea); about 8 gives Earth's look of a few large continents and some smaller ones; many give an archipelago of mid-sized lands. Cores that meet usually stay apart by a strait. More continents mean more coast, more ports and more sea between peoples (spec 89)"
earth = 8.0
realistic = [4.0, 14.0]
sandbox = [1.0, 40.0]
step = 1.0

[[card]]
id = "country"
title = "A country"
design = "design/macro-layer.md"
rows = [
  { field = "name", need = "A name from its culture (parody of the real profile's)", spec = "49" },
  { field = "area", need = "Area", spec = "52" },
  { field = "people", need = "People", spec = "48" },
  { field = "income", need = "Income group from endowment, access and history", spec = "52" },
  { field = "endowment", need = "Endowment", spec = "52" },
  { field = "coast", need = "Coast or landlocked", spec = "52" },
  { field = "capital", need = "Capital cell and how long it was held", spec = "52" },
  { field = "sectors", need = "Sectors cut inside the country", spec = "48" },
  { field = "towns", need = "Towns", spec = "48" },
  { field = "origin", need = "How it came to be: a founder, a union of two, a split from one", spec = "91" },
  { field = "alliance", need = "The alliance it is in (as the EU or NATO)", spec = "91" },
  { field = "profile", need = "The real profile it borrows: age, education, work, households", spec = "49" },
  { field = "calendar", need = "Weekends, holidays, school days", spec = "53" },
  { field = "", need = "Towns named from the country's culture (status step 3, next)" },
  { field = "", need = "Capacity, deposits in use and routes (world systems steps 2-4, 6)" },
  { field = "", need = "Government, politics and starting policies (sandbox parameters §8)" },
  { field = "", need = "Culture shares and trust in authority (macro layer §6.2)" },
  { field = "", need = "Provinces inside the country" },
]

[[card]]
id = "town"
title = "A town"
design = "design/world-simulation.md"
rows = [
  { field = "people", need = "People, by rank-size in its country", spec = "48" },
  { field = "rank", need = "Rank in its country (1 is the capital city)", spec = "48" },
  { field = "cell", need = "Its cell on the planet", spec = "48" },
  { field = "name", need = "A name from the country's culture", spec = "47", note = "stand-in: the generated town's name, not yet the planet town's" },
  { field = "streets", need = "Streets", spec = "47" },
  { field = "businesses", need = "Businesses and institutions people work at", spec = "47" },
  { field = "households", need = "Households and people from the country's tables", spec = "47" },
  { field = "dwellings", need = "A dwelling with an address per household", spec = "51" },
  { field = "layout", need = "Streets and plots laid out in the town", spec = "71" },
  { field = "", need = "Zones of spec 48 inside the town" },
  { field = "", need = "Services by settlement size (research SV)" },
  { field = "", need = "Business premises from the business records" },
]

[[card]]
id = "pop"
title = "A pop"
design = "design/inhabitants.md"
rows = [
  { field = "name", need = "Name in the culture's order", spec = "47" },
  { field = "age_sex", need = "Age and sex", spec = "47" },
  { field = "nationality", need = "Nationality, heritage, birthplace, when they moved", spec = "47" },
  { field = "household", need = "Household, role and address", spec = "47" },
  { field = "education", need = "Education from the country's attainment", spec = "47" },
  { field = "occupation", need = "Occupation, workplace, years in the job, the job before", spec = "47" },
  { field = "skills", need = "Skills", spec = "47" },
  { field = "appearance", need = "Skin tone, hair, eyes", spec = "47" },
  { field = "body_seed", need = "Body seed (the census draws a body from it)", spec = "11" },
  { field = "lifepath", need = "Lifepath: terms at places that exist", spec = "47" },
  { field = "", need = "Body from real anthropometry (content tools §2, full human generator)" },
  { field = "", need = "Health conditions with medicine clocks" },
  { field = "", need = "Personality and dispositions (0071: they only nudge)" },
  { field = "", need = "Face genes shared by families; clothes, possessions and keys" },
  { field = "", need = "Ties: family, household, coworkers, classmates, neighbours (backlog item 47)" },
  { field = "", need = "Beliefs with source, age and confidence (spec 39: built in the world, not in the generator)" },
  { field = "schedule", need = "Today's schedule: where they are at any hour", spec = "54" },
  { field = "", need = "A diary (0067)" },
]

[[card]]
id = "house"
title = "A house"
design = "design/content-tools.md"
rows = [
  { field = "address", need = "Address on a street", spec = "51" },
  { field = "members", need = "Who lives there", spec = "51" },
  { field = "size", need = "Floor area from members and the country's income", spec = "51" },
  { field = "rooms", need = "Rooms, every one reachable, who sleeps where", spec = "51" },
  { field = "food", need = "Food in the pantry and the fridge from the household", spec = "51" },
  { field = "services", need = "Fridge and bathroom by income", spec = "51" },
  { field = "map", need = "The house as a site map the simulation can load", spec = "51" },
  { field = "", need = "Furniture beyond the room kit; loot by the household's jobs (interior generator)" },
  { field = "", need = "Storeys, facade by grammar, era style (building generator)" },
  { field = "", need = "A plot on a laid-out street (next)" },
]

# The world's settings a player may edit on the world card (spec 55 slice 5; sandbox parameters §1.2 setup kind,
# §1.4 bands). realistic: calibrated on Earth; sandbox: allowed, tagged as realism-breaking; outside both: rejected
# (clamped). Values beyond the Earth value mark the world as touched. Proposal: bands are defaults taken by Claude.

[[setting]]
field = "land_share"
label = "Land share"
what = "How much of the planet's surface stands above the sea. Earth 0.29: less makes a water world of islands, more a dry world of large interiors far from any coast. It sets where people can live, how far food travels and how much is shipped by sea (spec 31)"
earth = 0.29
realistic = [0.15, 0.45]
sandbox = [0.02, 0.95]
step = 0.01

[[setting]]
field = "global_temp_c"
label = "Mean temperature (C)"
what = "The planet's mean temperature at sea level. Earth 14 C. Colder pushes ice, tundra and boreal forest toward the equator and shrinks farmland; warmer spreads deserts and tropical forest and melts the polar seas. Every place keeps its own range around it (spec 31)"
earth = 14.0
realistic = [5.0, 25.0]
sandbox = [-30.0, 60.0]
step = 0.5

[[setting]]
field = "relief"
label = "Relief"
what = "How tall the mountains and how deep the sea floor. Earth 1. Higher relief makes taller ranges, more rain shadows and deserts behind them, more rivers and harder roads; lower makes flat lands with slow, wandering rivers (spec 31)"
earth = 1.0
realistic = [0.5, 2.0]
sandbox = [0.1, 5.0]
step = 0.05

[[setting]]
field = "moisture"
label = "Moisture"
what = "How much rain falls everywhere. Earth 1. Wetter makes more forest, rivers, lakes and food; drier makes more desert and grassland, fewer rivers and fewer people the land can feed (spec 31, spec 83)"
earth = 1.0
realistic = [0.5, 2.0]
sandbox = [0.1, 5.0]
step = 0.05

[[setting]]
field = "countries"
label = "Countries at the founding"
what = "How many states the world starts with (0: as many as the pack has; Earth's pack 183). They share the land, each growing from its capital by how hard the land is to cross; the pack's countries go to them by people within their income group. The history then unites and divides them, so today's count differs a little (spec 91)"
earth = 0.0
realistic = [0.0, 250.0]
sandbox = [0.0, 600.0]
step = 1.0

[[setting]]
field = "history"
label = "History (unions and divisions)"
what = "How eventful the world's recorded history is. Earth 1: some regions break away as new countries and some smaller neighbours unite into new ones, each with its own name. 0 keeps the founders as they were; higher makes more new countries. The history seed (in the New world dialog) decides which (spec 91)"
earth = 1.0
realistic = [0.5, 2.0]
sandbox = [0.0, 5.0]
step = 0.05


[[setting]]
field = "radius_km"
label = "Planet radius (km)"
what = "The planet's size. Earth 6,371 km. A larger planet has more land, more countries and more people at the same density, and takes longer to generate; its cells stay about 5,000 km2. Small 3,400, medium 4,800, large 8,000 (spec 84)"
earth = 6371.0
realistic = [5000.0, 8000.0]
sandbox = [2000.0, 12000.0]
step = 10.0

[[setting]]
field = "fuel_richness"
label = "Fuels (coal, oil, gas)"
what = "How large the coal, oil and gas deposits are. Earth 1. The same deposits in the same places, larger or smaller: it sets how much fuel there is for power plants, vehicles and generators, and how long it lasts once the world breaks down (spec 84)"
earth = 1.0
realistic = [0.5, 2.0]
sandbox = [0.0, 5.0]
step = 0.05

[[setting]]
field = "metal_richness"
label = "Metals (iron, copper, bauxite)"
what = "How large the iron, copper and bauxite deposits are. Earth 1. The same deposits in the same places, larger or smaller: it sets how much there is to mine for steel, wire and aluminium (spec 84)"
earth = 1.0
realistic = [0.5, 2.0]
sandbox = [0.0, 5.0]
step = 0.05

[[setting]]
field = "fertility"
label = "Soil fertility"
what = "How fertile the soil is. Earth 1. It scales what each field yields, so how many people the land can feed, how far food must travel and how much farmland a town needs around it (spec 84, spec 88)"
earth = 1.0
realistic = [0.7, 1.3]
sandbox = [0.2, 2.0]
step = 0.05

[[setting]]
field = "forest"
label = "Forest"
what = "How much of the land is forest. Earth 1. More forest gives more timber and fuel wood and less open land; less forest leaves more grassland and pasture (spec 84)"
earth = 1.0
realistic = [0.7, 1.3]
sandbox = [0.0, 2.0]
step = 0.05

[[setting]]
field = "fish"
label = "Fish"
what = "How rich the seas near the coasts are. Earth 1. It scales the fish the shelves hold and the catch the ports land, so how much coastal towns can eat from the sea (spec 84, spec 88)"
earth = 1.0
realistic = [0.5, 1.5]
sandbox = [0.0, 3.0]
step = 0.05

[[setting]]
field = "people"
label = "People"
what = "How many people live on the land, against Earth's 8 billion on Earth's land. Earth 1. More people make larger and more towns, more traffic and more demand for food and fuel; fewer make an emptier world (spec 84)"
earth = 1.0
realistic = [0.5, 1.5]
sandbox = [0.05, 3.0]
step = 0.05