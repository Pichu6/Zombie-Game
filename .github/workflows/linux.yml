# Cross-compiler determinism (spec 01, decision 0055 §3.1): the golden hashes pinned on MSVC must
# reproduce on GCC and Clang. Headless only (no window).
name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  goldens:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Compiler
        run: $CXX --version
      - name: Configure
        run: cmake --preset release -DZS_BUILD_WINDOW=OFF
      - name: Build
        run: cmake --build --preset release
      - name: Tests (golden hashes)
        run: ctest --preset release
