# Builds the game on Windows (MSVC), runs the simulation tests there, and packages the sandbox
# window as a zip to download from the run's page (Actions tab -> the run -> Artifacts).
name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to refresh the windows-latest release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64 -DZS_BUILD_SANDBOX=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Simulation tests (golden hashes must match Linux)
        run: build\engine\sim\tests\Release\zs_sim_tests.exe
      - name: Content generator tests
        run: build\engine\gen\tests\Release\zs_gen_tests.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item build\apps\sandbox\Release\zs_sandbox.exe pkg\
          Copy-Item build\apps\headless\Release\zs_headless.exe pkg\
          Copy-Item -Recurse data pkg\data
          Set-Content pkg\README.txt "Double-click zs_sandbox.exe. Keys: WASD move, right click actions, Space pause, 1-6 speed, F5 save, F9 load. zs_sandbox.exe --seed N picks another run."
      - uses: actions/upload-artifact@v5
        with:
          name: juego-zombie-windows
          path: pkg
      - name: Publish as the windows-latest release (a stable download link)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path pkg\* -DestinationPath juego-zombie-windows.zip
          gh release view windows-latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --prerelease --title "Windows build (latest main)" --notes "Built automatically from main. Unzip and double-click zs_sandbox.exe."
          }
          gh release upload windows-latest juego-zombie-windows.zip --clobber
