# Checks the research notes against decision 0054 (headers, findings, index, links back).
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Research notes
        run: python3 tools/docs/check_research.py
